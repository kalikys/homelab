# Startup farm on VM 230: n8n (skeleton: stages, guardrails, approvals), Postgres (n8n, farm state, Phoenix),
# Phoenix (agent traces: model calls, tools, tokens, cost).
# Secrets live in /opt/farm/.env on the VM only. UI and webhooks are reachable from the LAN and Tailscale only.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
      FARM_DB_PASSWORD: ${FARM_DB_PASSWORD}
      FARM_RO_PASSWORD: ${FARM_RO_PASSWORD}
      PHOENIX_DB_PASSWORD: ${PHOENIX_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 10s
      retries: 10
    mem_limit: 768m
    ports:
      - "127.0.0.1:5432:5432"

  n8n:
    image: n8nio/n8n:2.41.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: n8n.home.kalik8s.ru
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.home.kalik8s.ru/
      N8N_EDITOR_BASE_URL: https://n8n.home.kalik8s.ru/
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
      GENERIC_TIMEZONE: Asia/Tbilisi
      TZ: Asia/Tbilisi
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_PUBLIC_API_DISABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "720"
    volumes:
      - n8ndata:/home/node/.n8n
    ports:
      - "5678:5678"
    networks:
      default: {}
      agents:
        ipv4_address: 172.30.0.2
    mem_limit: 1536m

  phoenix:
    image: arizephoenix/phoenix:version-20.18
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://phoenix:${PHOENIX_DB_PASSWORD}@postgres:5432/phoenix
      PHOENIX_ENABLE_AUTH: "true"
      PHOENIX_SECRET: ${PHOENIX_SECRET}
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_ADMIN_PASSWORD}
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_ROOT_URL: https://phoenix.home.kalik8s.ru
    ports:
      - "6006:6006"
    networks:
      default: {}
      agents:
        ipv4_address: 172.30.0.4
    mem_limit: 2g

  # Agents: Claude Code headless. Locked down by host/farm/agent-egress.sh: proxy and Phoenix only.
  agent-runner:
    build: ./agent-runner
    image: farm/agent-runner:local
    restart: unless-stopped
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      # Real model credentials live only in model-proxy; the runner only learns which ones exist.
      HAS_SUBSCRIPTION: ${CLAUDE_CODE_OAUTH_TOKEN:+1}
      HAS_API_KEY: ${ANTHROPIC_API_KEY:+1}
      MODEL_PROXY: http://172.30.0.5
      # Landing publishing (stage 04) by the server only; agents run as uid 1000 and cannot read these.
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_KV_SITES_ID: ${CF_KV_SITES_ID:-}
      LANDING_BASE_URL: ${LANDING_BASE_URL:-}
      MAX_BUDGET_PER_RUN_USD: ${MAX_BUDGET_PER_RUN_USD:-8}
      HTTP_PROXY: http://172.30.0.3:3128
      HTTPS_PROXY: http://172.30.0.3:3128
      NO_PROXY: phoenix,172.30.0.4,localhost,127.0.0.1
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_ENABLE_TELEMETRY: "1"
      CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: "1"
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://172.30.0.4:6006
      OTEL_EXPORTER_OTLP_HEADERS: authorization=Bearer ${PHOENIX_API_KEY:-none}
      OTEL_RESOURCE_ATTRIBUTES: openinference.project.name=farm-agents
      OTEL_LOG_USER_PROMPTS: "1"
      OTEL_LOG_TOOL_DETAILS: "1"
    volumes:
      - ./skills:/skills:ro
      - agentwork:/work
    networks:
      agents:
        ipv4_address: 172.30.0.10
    mem_limit: 2g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Owner-approved 2026-10-01: the server starts as root only to run each agent as uid 1000,
    # so the agent cannot read the server's environment (RUNNER_TOKEN) through /proc.
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

  model-proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NGINX_ENVSUBST_FILTER: "^(CLAUDE_CODE_OAUTH_TOKEN|ANTHROPIC_API_KEY)$$"
    volumes:
      - ./model-proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      default: {}
      agents:
        ipv4_address: 172.30.0.5
    mem_limit: 128m

  egress-proxy:
    build: ./egress-proxy
    image: farm/egress-proxy:local
    restart: unless-stopped
    networks:
      default: {}
      agents:
        ipv4_address: 172.30.0.3
    mem_limit: 256m

networks:
  agents:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  pgdata:
  n8ndata:
  agentwork:
