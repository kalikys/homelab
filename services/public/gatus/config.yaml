storage:
  type: sqlite
  path: /data/data.db

ui:
  title: "Homelab status · Kalislav Smirnov"
  description: "Live status of my homelab"
  header: "Homelab status"
  link: "https://cv.kalik8s.ru"
  logo: "https://cv.kalik8s.ru/favicon.svg"
  dark-mode: true
  default-sort-by: group
  buttons:
    - name: "CV"
      link: "https://cv.kalik8s.ru"

endpoints:
  # --- Network ---
  - name: DNS resolver
    group: Network
    url: "192.168.1.2"
    interval: 60s
    dns:
      query-name: "google.com"
      query-type: "A"
    conditions:
      - "[DNS_RCODE] == NOERROR"
    ui: { hide-hostname: true, hide-url: true, hide-port: true }

  - name: Router
    group: Network
    url: "icmp://192.168.1.1"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    ui: { hide-hostname: true, hide-url: true, hide-port: true }

  - name: VPN gateway
    group: Network
    url: "icmp://192.168.1.3"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    ui: { hide-hostname: true, hide-url: true, hide-port: true }

  - name: Internet uplink
    group: Network
    url: "icmp://1.1.1.1"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[RESPONSE_TIME] < 300"
    ui: { hide-hostname: true, hide-url: true, hide-port: true }

  # --- Compute ---
  - name: Hypervisor
    group: Compute
    url: "https://192.168.1.52:8006"
    interval: 60s
    client:
      insecure: true
    conditions:
      - "[STATUS] == 200"
    ui: { hide-hostname: true, hide-url: true, hide-port: true }

  - name: Host metrics API
    group: Compute
    url: "http://192.168.1.52:61208/api/4/status"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    ui: { hide-hostname: true, hide-url: true, hide-port: true }

  # --- Edge ---
  - name: Reverse proxy & TLS
    group: Edge
    url: "https://home.kalik8s.ru"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    ui: { hide-hostname: true, hide-url: true, hide-port: true }

  - name: Public site (Cloudflare Tunnel)
    group: Edge
    url: "https://cv.kalik8s.ru"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    ui: { hide-hostname: true, hide-url: true, hide-port: true }

  # --- Apps ---
  - name: Document archive
    group: Apps
    url: "http://192.168.1.10:8000"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    ui: { hide-hostname: true, hide-url: true, hide-port: true }

  - name: Home dashboard
    group: Apps
    url: "http://192.168.1.10:3000"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    ui: { hide-hostname: true, hide-url: true, hide-port: true }

  - name: Uptime monitoring
    group: Apps
    url: "http://192.168.1.10:3001"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    ui: { hide-hostname: true, hide-url: true, hide-port: true }

  - name: Speed tracker
    group: Apps
    url: "http://192.168.1.10:8081"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    ui: { hide-hostname: true, hide-url: true, hide-port: true }
