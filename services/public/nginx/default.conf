# Agents that ask for Markdown (Accept: text/markdown) get the Markdown CV instead of the HTML page.
map $http_accept $wants_markdown {
    default             0;
    "~*text/markdown"   1;
}

# GitHub API responses are cached here so visitors never hit GitHub's anonymous rate limit.
proxy_cache_path /var/cache/nginx/github levels=1:2 keys_zone=github:1m max_size=10m inactive=1d use_temp_path=off;

# Contact clicks: time, event, source, creative, page language, visitor country. No IP address, no user agent.
log_format events '$time_iso8601 $event $arg_src $arg_c $arg_lang $http_cf_ipcountry';

# Old public names under kalik8s.ru and www: permanent redirects to kalik8s.com, path and query kept.
server {
    listen 80;
    server_name cv.kalik8s.ru www.kalik8s.com;
    server_tokens off;
    return 301 https://kalik8s.com$request_uri;
}

server {
    listen 80;
    server_name status.kalik8s.ru;
    server_tokens off;
    return 301 https://status.kalik8s.com$request_uri;
}

server {
    listen 80;
    server_name shell.kalik8s.ru;
    server_tokens off;
    return 301 https://shell.kalik8s.com$request_uri;
}

# The site itself: kalik8s.com through the tunnel, and the LAN address for health checks.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Behind the tunnel nginx sees plain http on port 80; keep redirects (/ru -> /ru/) relative.
    absolute_redirect off;
    charset utf-8;
    charset_types text/plain text/xml text/css application/javascript application/json;

    # Cloudflare marks plain-http visitors; LAN health checks carry no such header and are served as is.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    set $csp "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; frame-src https://shell.kalik8s.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'";

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $csp always;
    # Machine-readable versions of the page for AI agents and crawlers.
    add_header Link "</cv.md>; rel=\"alternate\"; type=\"text/markdown\", </llms.txt>; rel=\"describedby\"; type=\"text/plain\", </sitemap.xml>; rel=\"sitemap\"; type=\"application/xml\"" always;
    add_header Vary "Accept" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location = /api/status {
        proxy_pass http://gatus:8080/api/v1/endpoints/statuses?page=1&pageSize=1;
        proxy_set_header Host gatus;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Public repositories of the profile owner, newest activity first.
    location = /api/github/repos {
        resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
        set $gh_host api.github.com;
        proxy_pass https://$gh_host/users/kalikys/repos?type=owner&sort=pushed&per_page=20;
        proxy_ssl_server_name on;
        proxy_ssl_name api.github.com;
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent "kalik8s.com";
        proxy_set_header Accept "application/vnd.github+json";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_cache github;
        proxy_cache_valid 200 30m;
        proxy_cache_valid any 1m;
        proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Latest completed CI run on main, for the "infra checks" badge.
    location = /api/github/actions {
        resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
        set $gh_host api.github.com;
        proxy_pass https://$gh_host/repos/kalikys/homelab/actions/runs?branch=main&status=completed&per_page=1;
        proxy_ssl_server_name on;
        proxy_ssl_name api.github.com;
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent "kalik8s.com";
        proxy_set_header Accept "application/vnd.github+json";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_cache github;
        proxy_cache_valid 200 5m;
        proxy_cache_valid any 1m;
        proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header Cache-Control "public, max-age=120" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Recent commits of the homelab repo.
    location = /api/github/commits {
        resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
        set $gh_host api.github.com;
        proxy_pass https://$gh_host/repos/kalikys/homelab/commits?per_page=6;
        proxy_ssl_server_name on;
        proxy_ssl_name api.github.com;
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent "kalik8s.com";
        proxy_set_header Accept "application/vnd.github+json";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_cache github;
        proxy_cache_valid 200 15m;
        proxy_cache_valid any 1m;
        proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Checklists and exam dates from the k8s-certs repo, for /lab/ and the learning block.
    location ~ ^/api/github/certs/(?<certs_file>cka\.md|ckad\.md|cks\.md|exams\.json)$ {
        resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
        set $raw_host raw.githubusercontent.com;
        proxy_pass https://$raw_host/kalikys/k8s-certs/main/$certs_file;
        proxy_ssl_server_name on;
        proxy_ssl_name raw.githubusercontent.com;
        proxy_set_header Host raw.githubusercontent.com;
        proxy_set_header User-Agent "kalik8s.com";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Security-Policy;
        proxy_cache github;
        proxy_cache_valid 200 15m;
        proxy_cache_valid any 1m;
        proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Commits of k8s-certs: streak, heatmap and the latest commits on /lab/.
    location = /api/github/certs-commits {
        resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
        set $gh_host api.github.com;
        proxy_pass https://$gh_host/repos/kalikys/k8s-certs/commits?per_page=100;
        proxy_ssl_server_name on;
        proxy_ssl_name api.github.com;
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent "kalik8s.com";
        proxy_set_header Accept "application/vnd.github+json";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_cache github;
        proxy_cache_valid 200 15m;
        proxy_cache_valid any 1m;
        proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Contact clicks reported by app.js (navigator.sendBeacon). One line per click in a file that
    # outlives the container; scripts/site-events.sh sums it up.
    location ~ ^/e/(?<event>call|email|telegram|linkedin|github|cv_pdf)$ {
        access_log /var/log/site/events.log events;
        return 204;
    }

    # Written by a host cron job every 5 minutes, so it must not sit in caches for an hour.
    location = /data/stats.json {
        add_header Cache-Control "public, max-age=60" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy $csp always;
    }

    # Markdown CV and llms.txt are meant to be read by people and AI tools in the browser, not downloaded.
    location ~* \.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
        expires 1h;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(css|js|svg|pdf|json|jpg|png|xml|txt)$ {
        expires 1h;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy $csp always;
    }

    # /lab/ embeds the asciinema player: its terminal emulator is WebAssembly and the stream is a websocket to asciinema.org.
    # Only this page gets 'wasm-unsafe-eval'; the server-level add_header lines pick up this $csp.
    location ~ ^/(ru/)?lab/$ {
        set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com wss://asciinema.org; frame-ancestors 'none'; base-uri 'self'; form-action 'none'";
        try_files ${uri}index.html =404;
    }

    location = / {
        if ($wants_markdown) { rewrite ^ /cv.md last; }
        try_files /index.html =404;
    }

    location = /ru/ {
        if ($wants_markdown) { rewrite ^ /cv.md last; }
        try_files /ru/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
