# Nginx Proxy Manager custom config (/opt/npm/data/nginx/custom/http.conf in LXC 102), included in the http block.
# Farm services on VM 230 behind the wildcard certificate. Not visible in the NPM UI: edit this file and reload.

map $http_upgrade $farm_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name n8n.home.kalik8s.ru phoenix.home.kalik8s.ru;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name n8n.home.kalik8s.ru;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-1/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-1/privkey.pem;
  client_max_body_size 50m;

  location / {
    proxy_pass http://192.168.1.30:5678;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $farm_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name phoenix.home.kalik8s.ru;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-1/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-1/privkey.pem;
  client_max_body_size 50m;

  location / {
    proxy_pass http://192.168.1.30:6006;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $farm_connection_upgrade;
    proxy_read_timeout 300s;
  }
}
