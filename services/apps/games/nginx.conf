server {
  listen 80;
  server_name _;
  root /srv/games;
  # Наружу видна только папка site каждой игры: /nap-spots/ -> /srv/games/nap-spots/site/
  location ~ ^/([a-z0-9-]+)/(.*)$ {
    alias /srv/games/$1/site/$2;
    index index.html;
    # прототипы меняются часто — без кеша
    add_header Cache-Control "no-cache";
  }
  location = / { return 302 /nap-spots/; }
  location ~ ^/([a-z0-9-]+)$ { return 301 /$1/; }
}
