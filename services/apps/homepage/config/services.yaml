- Приложения:
    - Документы:
        icon: paperless-ngx.png
        href: https://paperless.home.kalik8s.ru
        description: Архив документов Paperless
        server: local
        container: paperless-webserver-1
        widget:
          type: paperlessngx
          url: http://192.168.1.10:8000
          key: "{{HOMEPAGE_VAR_PAPERLESS_TOKEN}}"
