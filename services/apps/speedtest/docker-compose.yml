services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    restart: unless-stopped
    ports:
      - "8081:80"
    env_file: .env
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Tbilisi
      APP_TIMEZONE: Asia/Tbilisi
      DISPLAY_TIMEZONE: Asia/Tbilisi
      APP_URL: https://speedtest.home.kalik8s.ru
      ASSET_URL: https://speedtest.home.kalik8s.ru
      DB_CONNECTION: sqlite
      SPEEDTEST_SCHEDULE: "15 */3 * * *"
      PRUNE_RESULTS_OLDER_THAN: 365
      CHART_DATETIME_FORMAT: "d.m H:i"
      DATETIME_FORMAT: "d.m.Y H:i"
    volumes:
      - ./config:/config
