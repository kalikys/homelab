# Дашборд проектов: https://projects.home.kalik8s.ru, только LAN и Tailscale. Без авторизации (AUTH_MODE=token включает её).
services:
  projects:
    build: .
    image: projects:local
    container_name: projects
    restart: unless-stopped
    ports:
      - "8790:8790"
    environment:
      TZ: Asia/Tbilisi
      AUTH_MODE: none
    volumes:
      - ./data:/data
    mem_limit: 256m
    networks:
      default:
        # hostname сайдкара тоже "projects", поэтому прокси ходит по этому алиасу
        aliases: [dashboard]

  # Отдельная Tailscale-нода только с дашбордом: её шарят друзьям (Machines → Share), весь LAN им не виден.
  # https://projects.tail645bfc.ts.net → dashboard:8790. Первый вход: ссылка в `docker logs projects-ts`.
  projects-ts:
    image: tailscale/tailscale:v1.102.5
    container_name: projects-ts
    hostname: projects
    restart: unless-stopped
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./ts-serve.json:/config/serve.json:ro
    depends_on:
      - projects
    mem_limit: 128m
